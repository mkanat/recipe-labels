<VirtualHost *:80>
    ServerName recipe.kanat.us

    # Redirect all HTTP traffic to HTTPS
    Redirect permanent / https://recipe.kanat.us/
</VirtualHost>

<VirtualHost *:443>
    ServerName recipe.kanat.us

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/recipe.kanat.us/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/recipe.kanat.us/privkey.pem

    # Proxy headers
    ProxyPreserveHost On
    ProxyPass / http://localhost:3000/
    ProxyPassReverse / http://localhost:3000/

    # Security headers
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains"
    Header set X-XSS-Protection "1; mode=block"
    Header set X-Content-Type-Options nosniff
    Header set X-Frame-Options SAMEORIGIN

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/recipe_error.log
    CustomLog ${APACHE_LOG_DIR}/recipe_access.log combined
</VirtualHost>
